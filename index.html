<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
	margin: 0;
	background: linear-gradient(135deg, #89CFF0, #B6E0FE);
	font-family: "Poppins", sans-serif;
	text-align: center;
	color: white;
}

/* FIX SCROLL */
.wrapper {
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: flex-start;
	padding: 40px 15px;
	box-sizing: border-box;
}

.container {
	max-width: 500px;
	width: 100%;
}

/* TEXT */
h1 {
	font-family: "Pacifico", cursive;
	font-size: clamp(26px, 6vw, 36px);
	margin-bottom: 20px;
}

/* VIDEO */
video {
	width: 100%;
	border-radius: 20px;
	box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* BUTTON */
button {
	margin-top: 20px;
	padding: 12px 25px;
	border-radius: 30px;
	border: none;
	background: white;
	color: #4aa3df;
	font-weight: bold;
	cursor: pointer;
	box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* CAPTION */
.caption {
	margin-top: 25px;
	font-size: 15px;
	line-height: 1.7;
	max-width: 420px;
	margin-left: auto;
	margin-right: auto;
	display: none;
}

/* biar spacing bawah ada */
.spacer {
	height: 50px;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="container">

<h1>Ini buat kamu 💙</h1>

<video id="video" playsinline>
	<source src="video.mp4" type="video/mp4">
</video>

<button onclick="playVideo()">Play dulu dongg 💙</button>

<div id="caption" class="caption"></div>

<div class="spacer"></div>

</div>
</div>

<script>
const video = document.getElementById("video");
const caption = document.getElementById("caption");

const text = `Terimakasih sudah memilih aku menjadi kekasihmu, terimakasih sudah melakukan semuanya untuk aku

Terimakasih untuk semua kebahagiaan yang kamu kasih untuk aku. Maaf kalau aku belum cukup baik untuk kamu,

maaf kalau aku masih suka bikin kamu kesal, maaf untuk semua kesalahan aku yang disengaja maupun tidak.

Aku beruntung bisa kenal kamu, aku beruntung bisa ketemu kamu, aku senang kamu masuk ke hidup aku.

Selalu sama aku ya, kita capai wishlist kita bareng bareng.

Aku sayang kamu, selalu.`;

let i = 0;

function playVideo() {
	video.muted = false;
	video.play().then(() => {
		caption.style.display = "block";
		typeText();
	}).catch(() => {
		alert("Klik sekali lagi ya 💙");
	});
}

function typeText() {
	if (i < text.length) {
		if (text.charAt(i) === "\n") {
			caption.innerHTML += "<br><br>";
		} else {
			caption.innerHTML += text.charAt(i);
		}
		i++;
		setTimeout(typeText, 20);
	}
}
</script>

</body>
</html>
