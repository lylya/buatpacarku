<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Untuk Kamu 💙</title>

		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Pacifico&display=swap"
			rel="stylesheet"
		/>

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				min-height: 100%;
				font-family: "Poppins", sans-serif;
				background: linear-gradient(180deg, #89cff0, #b6e0fe);
				overflow-x: hidden;
			}

			/* HAPUS flex center dari body */
			.wrapper {
				min-height: 100vh;
				padding: 40px 15px;
				box-sizing: border-box;
				display: block; /* 🔥 ini kunci */
			}

			.container {
				max-width: 500px;
				margin: 0 auto;
				text-align: center;
			}

			/* biar ada ruang bawah */
			.spacer {
				height: 80px;
			}
			.wrapper {
				min-height: 100vh;
			}
		</style>
	</head>

	<body>
		<div class="wrapper">
			<div class="container">
				<h1>Ini buat kamu 💙</h1>

				<video id="video" playsinline webkit-playsinline controls>
					<source src="video.mp4" type="video/mp4" />
				</video>

				<button onclick="playVideo()">Play dulu dongg 💙</button>

				<div id="caption" class="caption"></div>

				<div class="spacer"></div>
			</div>
		</div>

		<script>
						const video = document.getElementById("video");
						const caption = document.getElementById("caption");

						const text = `Terimakasih sudah memilih aku menjadi kekasihmu, terimakasih sudah melakukan semuanya untuk aku

			Terimakasih untuk semua kebahagiaan yang kamu kasih untuk aku. Maaf kalau aku belum cukup baik untuk kamu,

			maaf kalau aku masih suka bikin kamu kesal, maaf untuk semua kesalahan aku yang disengaja maupun tidak.

			Aku beruntung bisa kenal kamu, aku beruntung bisa ketemu kamu, aku senang kamu masuk ke hidup aku.

			Selalu sama aku ya, kita capai wishlist kita bareng bareng.

			Aku sayang kamu, selalu.`;

						let i = 0;

						function playVideo() {
				video.muted = false;
				video.play();
								.play()
								.then(() => {
									caption.style.display = "block";
									typeText();
								})
								.catch(() => {
									alert("Klik sekali lagi ya 💙");
								});
						}

						function typeText() {
							if (i < text.length) {
								if (text.charAt(i) === "\n") {
									caption.innerHTML += "<br><br>";
								} else {
									caption.innerHTML += text.charAt(i);
								}
								i++;
								setTimeout(typeText, 20);
							}
						}
		</script>
	</body>
</html>
